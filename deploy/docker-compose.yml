  # ===========================================================================
  # DATA BOARD — db-init creates the `databoard` DB owned by the `imbrace` role
  # plus the drizzle schema (templates/databoard-db-init-job.yaml); table DDL is
  # owned by the app's drizzle migrations. In-network only (:8866).
  # ===========================================================================

  databoard-db-init:
    <<: *db-init
    environment:
      PGHOST: imbrace-svc-postgresql
      PGPORT: "5432"
      PGDATABASE: databoard
      PGSUPERUSER: postgres
      PGSUPERPASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
      PGAPPUSER: imbrace
      PGAPPPASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "[init] waiting for Postgres at $$PGHOST:$$PGPORT..."
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" >/dev/null 2>&1; do sleep 3; done
        echo "[init] ensuring role '$$PGAPPUSER' (idempotent)..."
        PGPASSWORD="$$PGSUPERPASSWORD" psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" -d postgres -v ON_ERROR_STOP=1 \
          -v appuser="$$PGAPPUSER" -v apppass="$$PGAPPPASSWORD" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L CREATEDB', :'appuser', :'apppass')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'appuser')\gexec
        SQL
        echo "[init] ensuring database '$$PGDATABASE' owned by '$$PGAPPUSER' (idempotent)..."
        PGPASSWORD="$$PGSUPERPASSWORD" psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" -d postgres -v ON_ERROR_STOP=1 \
          -v dbname="$$PGDATABASE" -v appuser="$$PGAPPUSER" <<'SQL'
        SELECT format('CREATE DATABASE %I OWNER %I', :'dbname', :'appuser')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'dbname')\gexec
        SQL
        echo "[init] ensuring drizzle schema..."
        PGPASSWORD="$$PGAPPPASSWORD" psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGAPPUSER" -d "$$PGDATABASE" \
          -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS "drizzle";'
        echo "[init] done"

