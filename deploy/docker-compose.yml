  # ===========================================================================

  app-gateway:
    image: docker.io/imbraceltd/app-gateway:v0.0.10-319d3a1
    container_name: imbrace-svc-app-gateway
    restart: unless-stopped
    # The gateway wires its upstreams at startup (chart frontendRedeploy hook
    # parity) — start it after the backends.
    depends_on:
      platform-service:
        condition: service_started
      channel-service:
        condition: service_started
      data-board:
        condition: service_started
      marketplace:
        condition: service_started
      file-service:
        condition: service_started
      chat-ai:
        condition: service_started
      ai-agent:
        condition: service_started
      apworkflow-api:
        condition: service_started
    environment:
      ENV: "production"
      VERSION: "1.0.0"
      PUBLIC_SERVER_PORT: "9001"
      LOG_LEVEL: "info"
      RATELIMIT_WINDOW: "1800000"
      RATELIMIT_MAX_REQUEST_PER_WINDOW: "100"
      BACKEND_PUBLIC_HOST: "http://imbrace-svc-platform-service:6040"
      BACKEND_PRIVATE_HOST: "http://imbrace-svc-platform-service:6040"
      AI_SERVICE: "http://imbrace-svc-chat-ai:8080"
      MARKETPLACE_SERVICE: "http://imbrace-svc-marketplace:4000"
      AI_SERVICE_PYTHON: "http://imbrace-svc-chat-ai:8080"
      AI_SERVICE_CHAT: "http://imbrace-svc-chat-ai:8080"
      AI_CHAT_WEBSOCKET: "http://imbrace-svc-chat-ai:8080"
      image_tag: ""
      log_group: ""
      FILE_SERVICE_HOST: "http://imbrace-svc-file-service:8866"
      DATA_BOARD_HOST: "http://imbrace-svc-data-board:8866"
      DATA_BOARD_PROXY_TOKEN: ""
      DATA_BOARD_PROXY_TIMEOUT_MS: "300000"
      ACTIVEPIECES_BACKEND_HOST: "http://imbrace-svc-apworkflow-api:3000"
      ACTIVEPIECES_ENGINE_HOST: "http://imbrace-svc-apworkflow-worker:3001"
      ACTIVEPIECES_WS_HOST: "http://imbrace-svc-apworkflow-api:3000"
      WORKFLOW_HOST: "http://imbrace-svc-apworkflow-api:3000"
      ACTIVEPIECES_TRUSTED_SOURCES: "localhost,127.0.0.1,${PUBLIC_HOST:-localhost}:6868,${PUBLIC_HOST:-localhost}:30700,imbrace-svc-apworkflow-api,imbrace-svc-apworkflow-api.imbrace-services,*.imbrace.local,imbrace.local,apwf.imbrace.local,apwf.dev.imbrace.lan,apwf.dev.imbrace.co"
      PLATFORM_SERVICE_HOST: "http://imbrace-svc-platform-service:6040"
      CHANNEL_SERVICE_HOST: "http://imbrace-svc-channel-service:4000"
      CHANNEL_SERVICE_ENABLED: "true"
      AUTH_SERVICE_URL: "http://imbrace-svc-platform-service:6040"
      # ai-agent container listens on 3000 (the k8s Service remapped 80->3000)
