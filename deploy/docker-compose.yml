  # ===========================================================================
  # OPTIONAL — logs + metrics (profile: logging). Converted from the chart's
  # logging-* templates (Loki + Alloy + Grafana + Prometheus). In k8s Alloy
  # tails /var/log/pods; here it discovers Docker containers via the socket.
  # Grafana: http://<PUBLIC_HOST>:36868 (admin/admin — rotate for prod).
  # ===========================================================================

  loki:
    image: docker.io/grafana/loki:3.5.7
    container_name: imbrace-loki
    profiles: [logging]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - loki-data:/loki
    configs:
      - source: loki-config
        target: /etc/loki/loki.yaml
    networks:
      imbrace-net:
        aliases: [imbrace-loki]

  alloy:
    image: docker.io/grafana/alloy:v1.17.1
    container_name: imbrace-alloy
    profiles: [logging]
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    configs:
      - source: alloy-config
        target: /etc/alloy/config.alloy
    networks:
      imbrace-net:

  prometheus:
    image: docker.io/prom/prometheus:v2.53.0
    container_name: imbrace-prometheus
    profiles: [logging]
    restart: unless-stopped
    volumes:
      - prom-data:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    networks:
      imbrace-net:
        aliases:
          - imbrace-prometheus
          - imbrace-prometheus.imbrace-services

  grafana:
    image: docker.io/grafana/grafana:12.3.8
    container_name: imbrace-grafana
    profiles: [logging]
    restart: unless-stopped
    ports:
      - "36868:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
    networks:
      imbrace-net:

# =============================================================================
# INLINE CONFIG FILES
# NOTE: compose interpolates `content`, so every literal `$` is written as `$$`.
# =============================================================================
configs:

  # Converted from templates/postgresql-initdb-cm.yaml
  # (imbrace-svc-postgresql-initdb). Runs once on FIRST cluster init (empty
  # PGDATA), before postgres accepts external connections. Idempotent.
  postgres-initdb:
    content: |
      #!/bin/sh
      set -e

      : "$${IMBRACE_DB_USER:=imbrace}"
      : "$${IMBRACE_DB_PASSWORD:=changeme-postgres-pass}"

      # 00 — app role + grants on the default `imbrace` DB
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d postgres <<EOSQL
      SELECT 'CREATE ROLE $$IMBRACE_DB_USER LOGIN PASSWORD ''$$IMBRACE_DB_PASSWORD'' CREATEDB'
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$$IMBRACE_DB_USER')\gexec

      GRANT ALL PRIVILEGES ON DATABASE imbrace TO $$IMBRACE_DB_USER;
      EOSQL
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d imbrace \
        -c "GRANT ALL ON SCHEMA public TO $$IMBRACE_DB_USER;"

      # 01 — sibling databases (head-start; each service's db-init re-ensures its own)
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d postgres <<EOSQL
      SELECT 'CREATE DATABASE apworkflowdb OWNER $$IMBRACE_DB_USER'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'apworkflowdb')\gexec

      SELECT 'CREATE DATABASE chatai OWNER postgres'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'chatai')\gexec

      SELECT 'CREATE DATABASE databoard OWNER $$IMBRACE_DB_USER'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'databoard')\gexec
      EOSQL

      # 02 — pgvector in chatai
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d chatai \
        -c "CREATE EXTENSION IF NOT EXISTS vector;"

      echo "[initdb] imbrace role + databases + pgvector ready"

  # Garage v2 config — parity with the garage subchart values
  # (db_engine lmdb, replication_factor 1, block_size 1MiB, region "garage").
  garage-config:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"

      replication_factor = 1
      consistency_mode = "consistent"
      compression_level = 1
      block_size = 1048576

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "imbrace-svc-garage:3901"
      # Dev-only fixed secret (the chart auto-generates one). Rotate for prod:
      #   openssl rand -hex 32
      rpc_secret = "3e9c6b0d8a415f27c1d9e8b3a6f40217d5c8e9f1a2b3c4d5e6f708192a3b4c5d"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.imbrace.local"

      [s3_web]
      bind_addr = "[::]:3902"
      root_domain = ".web.imbrace.local"
      index = "index.html"

  # Unified entry point on :6868 (Traefik IngressRoute replacement).
  edge-proxy-nginx:
    content: |
      worker_processes 1;
      error_log /dev/stderr warn;
      pid /tmp/nginx.pid;

      events {
        worker_connections 1024;
      }

      http {
        access_log /dev/stdout;
        sendfile on;
        tcp_nopush on;
        keepalive_timeout 65;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
        client_max_body_size 1g;

        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
        }

        # Resolve upstreams at request time so nginx starts even when app
        # containers aren't up yet (Docker's embedded DNS).
        resolver 127.0.0.11 valid=10s;

        server {
          listen 6868;
          server_name _;

          set $$gateway   imbrace-svc-app-gateway:9001;
          set $$apwf_api  imbrace-svc-apworkflow-api:3000;
          set $$dashboard imbrace-svc-imbrace-fe:80;

          # /api -> app-gateway, prefix stripped (Traefik stripPrefix parity)
          location = /api {
            rewrite ^ / break;
            proxy_pass http://$$gateway;
            proxy_set_header Host $$host;
          }
          location /api/ {
            rewrite ^/api/(.*)$$ /$$1 break;
            proxy_pass http://$$gateway;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }

          # /ws -> app-gateway, path unchanged (websocket)
          location /ws {
            proxy_pass http://$$gateway;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }

          # /socket.io -> apworkflow API (websocket), path unchanged
          location /socket.io {
            proxy_pass http://$$apwf_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }

          # /ap-workflow -> apworkflow API, path unchanged
          location /ap-workflow {
            proxy_pass http://$$apwf_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          # everything else -> dashboard SPA
          location / {
            proxy_pass http://$$dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }
        }
      }

  # apworkflow combined proxy — converted from
  # templates/apworkflow-proxy-configmap.yaml. Host :30700 -> / (SPA),
  # /api/ (REST, prefix stripped), /socket.io/ (ws).
  apworkflow-proxy-nginx:
    content: |
      worker_processes 1;
      error_log /dev/stderr warn;
      pid /tmp/nginx.pid;

      events {
        worker_connections 1024;
      }

      http {
        access_log /dev/stdout;
        sendfile on;
        tcp_nopush on;
        keepalive_timeout 65;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
        client_max_body_size 1g;

        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
        }

        client_body_temp_path /tmp/client_body;
        proxy_temp_path       /tmp/proxy;
        fastcgi_temp_path     /tmp/fastcgi;
        uwsgi_temp_path       /tmp/uwsgi;
        scgi_temp_path        /tmp/scgi;

        resolver 127.0.0.11 valid=10s;

        server {
          listen 8080;
          server_name _;

          set $$apwf_api imbrace-svc-apworkflow-api:3000;
          set $$apwf_app imbrace-svc-apworkflow-app:4200;

          location /api/ {
            rewrite ^/api/(.*)$$ /$$1 break;
            proxy_pass http://$$apwf_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }

          location /socket.io/ {
            proxy_pass http://$$apwf_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }

          location / {
            proxy_pass http://$$apwf_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }
        }
      }

  # Loki single-binary, filesystem store — parity with the chart's logging.loki
  # (retention 168h / 7 days).
  loki-config:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100

      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        retention_period: 168h

      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem

  # Alloy — tail every Docker container's logs and push to Loki.
  # (k8s chart tails /var/log/pods; docker equivalent = docker discovery.)
  alloy-config:
    content: |
      discovery.docker "containers" {
        host = "unix:///var/run/docker.sock"
      }

      discovery.relabel "containers" {
        targets = discovery.docker.containers.targets
        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_project"]
          target_label  = "project"
        }
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "service"
        }
      }

      loki.source.docker "containers" {
        host       = "unix:///var/run/docker.sock"
        targets    = discovery.relabel.containers.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://imbrace-loki:3100/loki/api/v1/push"
        }
      }

  # Prometheus — queried by app-gateway
  # (PROMETHEUS_HOST=http://imbrace-prometheus:9090).
  prometheus-config:
    content: |
      global:
        scrape_interval: 30s

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        # Add app scrape targets here if/when services expose /metrics, e.g.:
        # - job_name: app-gateway
        #   static_configs:
        #     - targets: ["imbrace-svc-app-gateway:9001"]

  grafana-datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://imbrace-loki:3100
          isDefault: true
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://imbrace-prometheus:9090

volumes:
  pgdata:
  redis-data:
  kafka-data:
  garage-meta:
  garage-data:
  file-data:
  file-logs:
  databoard-logs:
  agent-files:
  worker-codes:
  worker-cache:
  licenses:
  loki-data:
  alloy-data:
  prom-data:
  grafana-data:

networks:
  imbrace-net:
    # Created as `imbrace_imbrace-net` by this project. Uncomment to pin the
    # bare name (e.g. to attach other stacks that expect `imbrace-net`):
    # name: imbrace-net
