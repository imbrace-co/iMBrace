          - imbrace-svc-app-gateway.imbrace-services.svc.cluster.local

  # ===========================================================================
  # FRONTENDS
  # ===========================================================================

  # Dashboard SPA (nginx-served Vite build). Runtime config is delivered as ENV
  # VARS (the OSS image writes its own env.json at startup). Served publicly at
  # <PUBLIC_HOST>:6868/ via the edge proxy.
  imbrace-fe:
    image: docker.io/imbraceltd/imbrace-fe:v0.0.15-f012f20
    container_name: imbrace-svc-imbrace-fe
    restart: unless-stopped
    depends_on:
      app-gateway:
        condition: service_started
    environment:
      VITE_APP_ENV: "prod"
      VITE_APP_HOST: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868"
      VITE_IS_MULTI_TENANCY: "true"
      VITE_APP_API_HOST: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868/api"
      VITE_APP_API_HOST_OLD: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868/api"
      VITE_APP_AI_HOST: ""
      VITE_APP_INTERNAL_AI_CHAT_HOST: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30030"
      VITE_APP_CHAT_HOST: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30050"
      VITE_APP_API_CHAT_HOST: ""
      VITE_APP_N8N_DOMAIN: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30700"
      VITE_APP_N8N_DOMAIN_V2: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30700"
      VITE_APP_ACTIVEPIECES_DOMAIN: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30700"
      # apworkflow combined proxy (chart: <release>-apworkflow-proxy:80)
      APWF_URL: "http://imbrace-svc-apworkflow-proxy:8080"
      BACKEND_URL: "http://imbrace-svc-app-gateway:9001"
      VITE_APP_ON_PREMISE: "true"
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-imbrace-fe
          - imbrace-svc-imbrace-fe.imbrace-services

  # insightIQ — AI chat SPA (imbrace-ai-chatbot). The image reads env vars at
  # startup and writes its own env.json. Published on host :30030 (chart
  # NodePort) so the dashboard's VITE_APP_INTERNAL_AI_CHAT_HOST is reachable
  # from the browser.
  insightiq:
    image: docker.io/imbraceltd/imbrace-ai-chatbot:v0.0.2-b860d6b
    container_name: imbrace-svc-insightiq
    restart: unless-stopped
    depends_on:
      app-gateway:
        condition: service_started
    ports:
      - "30030:3000"
    environment:
      IMBRACE_BASE_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868"
      IMBRACE_APP_GATEWAY_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868"
      IMBRACE_WORKFLOW_DOMAIN: "${PUBLIC_HOST:-localhost}:30700"
      IMBRACE_NEXT_BEST_ACTION_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30040"
      BACKEND: "http://imbrace-svc-app-gateway:9001"
      BACKEND_HOST: "imbrace-svc-app-gateway:9001"
    networks:
      imbrace-net:
        aliases:
