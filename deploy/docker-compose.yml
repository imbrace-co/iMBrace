      DOCUMENT_API_VERSION: "v2"
      AWS_S3_BUCKET: "imbrace"
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-apworkflow-api
          - imbrace-svc-apworkflow-api.imbrace-services

  apworkflow-app:
    image: docker.io/imbraceco/apwf:dev-fe-6009262
    container_name: imbrace-svc-apworkflow-app
    restart: unless-stopped
    # nginx resolves BACKEND_UPSTREAM at start and exits if the api container
    # does not exist yet, so wait for it.
    depends_on:
      apworkflow-api:
        condition: service_started
    environment:
      AP_ENVIRONMENT: "dev"
      # allowed origins: proxy :30700, unified web :6868, ws :6868
      # Dashboard origins allowed to embed the workflow app (CSP frame-ancestors). The
      # localhost ones let the dashboard also work at localhost:6868 on the Docker host
      # when PUBLIC_HOST is the machine's IP.
      WEBAPP_ORIGIN: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30700 ${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868 ${WS_SCHEME:-ws}://${PUBLIC_HOST:-localhost}:6868 http://localhost:6868 http://127.0.0.1:6868"
      BACKEND_UPSTREAM: "http://imbrace-svc-apworkflow-api:3000"
      AP_FRONTEND_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30700"
      AP_INTERNAL_URL: "http://imbrace-svc-apworkflow-api:3000/api"
      BASE_PATH: ""
      GATEWAY_URL: "http://imbrace-svc-app-gateway:9001/activepieces"
      VITE_GATEWAY_URL: "http://imbrace-svc-apworkflow-app:4200"
      AP_GATEWAY_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868/api"
      VITE_APP_GATEWAY_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868/api"
      IMBRACE_API_DOMAIN: "http://imbrace-svc-app-gateway:9001"
      AP_IMBRACE_ADDING_CONNECTION_PIECES: "@activepieces/piece-google-calendar,@activepieces/piece-calendly,@activepieces/piece-google-drive,@activepieces/piece-google-docs,@activepieces/piece-clickup"
      AP_CHAT_WIDGET: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30050"
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-apworkflow-app
          - imbrace-svc-apworkflow-app.imbrace-services

  apworkflow-worker:
    image: docker.io/imbraceco/apwf:dev-engine-6009262
    container_name: imbrace-svc-apworkflow-worker
    restart: unless-stopped
    depends_on:
      apworkflow-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *ap-secrets
      AP_CONTAINER_TYPE: "WORKER"
      NODE_ENV: "development"
      ENGINE_PORT: "3001"
      AP_BACKEND_URL: "http://imbrace-svc-apworkflow-api:3000"
      AP_ENGINE_WS_PORT: "12345"
      WORKER_ID: "imbrace-svc-apworkflow-worker-0"
      NX_PLUGIN_NO_TIMEOUTS: "true"
      NX_DAEMON: "false"
      AP_EXECUTION_MODE: "UNSANDBOXED"
      AP_BASE_CODE_DIRECTORY: "/usr/src/app/codes"
      AP_CACHE_PATH: "/usr/src/app/cache"
      AP_PIECES_SOURCE: "FILE"
      AP_DEV_PIECES: "google-sheets,webhook,whatsapp,http,common,common-ai,framework,send-message,crypto,csv,data-mapper,data-summarizer,date-helper,delay,file-helper,forms,graphql,image-helper,math-helper,qrcode,schedule,sftp,store,subflows,tables,tags,text-helper,todos,xml,connections,smtp"
      AP_PIECES_SYNC_MODE: "NONE"
      KAFKA_ENABLED: "true"
      KAFKA_CLIENT_ID: "wcs-producer-imbrace"
      KAFKA_ENDPOINT: "imbrace-svc-kafka:9092"
      KAFKA_USE_SSL: "false"
      KAFKA_USE_SASL: "false"
      KAFKA_SASL_MECHANISM: "plain"
      KAFKA_SASL_USERNAME: ""
      KAFKA_SASL_PASSWORD: ""
      KAFKA_PARTITION: ""
      KAFKA_IS_AWS_KAFKA: "false"
      KAFKA_SSL_REJECT_UNAUTHORIZED: "false"
      KAFKA_CONSUMER_GROUP_ID: "activepieces-flows"
      KAFKA_TOPIC: "AP_INCOMING_MESSAGE,AP_OUTGOING_CRM_EVENT"
      KAFKA_AUTO_COMMIT: "false"
      KAFKA_MAX_BYTES_PER_PARTITION: "1048576"
      KAFKA_FROM_BEGINNING: "false"
      AP_QUEUE_MODE: "REDIS"
      AP_DB_TYPE: "POSTGRES"
      AP_POSTGRES_DATABASE: "apworkflowdb"
      AP_POSTGRES_HOST: "imbrace-svc-postgresql"
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_USERNAME: "imbrace"
      AP_FRONTEND_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30700"
      IMBRACE_API_DOMAIN: "http://imbrace-svc-app-gateway:9001"
      MESSAGE_SUGGESTION_API: "http://imbrace-svc-ai-agent:3000"
      PLATFORM_SERVICE_API: "http://imbrace-svc-platform-service:6040"
      AWS_S3_BUCKET: "imbrace"
      AP_REDIS_HOST: "imbrace-svc-redis-client"
      AP_REDIS_PORT: "6379"
      AP_REDIS_DB: "0"
      REDIS_HOST: "imbrace-svc-redis-client"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-imbrace-dev-redis-pass}
      REDIS_DB: "0"
      REDIS_TLS: "false"
      REDIS_TLS_REJECT_UNAUTHORIZED: "false"
      AWS_REGION: "garage"
      AWS_ACCESS_KEY_ID: ${GARAGE_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_KEY_SECRET:-}
      AWS_ENDPOINT_URL_S3: "http://imbrace-svc-garage:3900"
      AWS_ENDPOINT_URL: "http://imbrace-svc-garage:3900"
      S3_ENDPOINT: "http://imbrace-svc-garage:3900"
      S3_FORCE_PATH_STYLE: "true"
      AWS_S3_FORCE_PATH_STYLE: "true"
