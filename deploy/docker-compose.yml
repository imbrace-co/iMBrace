  AP_REDIS_PASSWORD: ${REDIS_PASSWORD:-imbrace-dev-redis-pass}
  AP_ENCRYPTION_KEY: "57a47fed4ce32358e3c52aadcee58c76"
  AP_JWT_SECRET: "b9343cbad8c546f2faba846463ce4f46cac6c9f8c17646096ceb6eaff39b1129"
  AP_WORKER_TOKEN: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6IjEifQ.eyJpZCI6IjdUVnZfVDJBMlFvQ0VsdC1OdEE2ViIsInR5cGUiOiJXT1JLRVIiLCJpYXQiOjE3NzkxMzYwNjUsImV4cCI6NDkzMjczNjA2NSwiaXNzIjoiYWN0aXZlcGllY2VzIn0.X1nFds7lB3b2FCucGKa3B-OuOdeuc1IAV6HvLEBQJ0I"

x-ai-agent-env: &ai-agent-env
