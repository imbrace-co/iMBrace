  #   db-init    : role `imbrace` + database `apworkflowdb` (post-install hook
  #                parity: templates/apworkflow-db-init-job.yaml)
  #   db-migrate : TypeORM migrations (apworkflowApi db-migrate init container)
  #   api        : REST API + engine (AP_CONTAINER_TYPE=WORKER_AND_APP, :3000)
  #   app        : React SPA (nginx, :4200)
  #   worker     : flow engine (AP_CONTAINER_TYPE=WORKER, :3001)
  #   proxy      : combined NodePort proxy — host :30700 -> / (app) + /api (api)
  # ===========================================================================

  apworkflow-db-init:
    <<: *db-init
    environment:
      PGHOST: imbrace-svc-postgresql
      PGPORT: "5432"
      PGDATABASE: apworkflowdb
      PGSUPERUSER: postgres
      PGSUPERPASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
      IMBRACE_USERNAME: imbrace
      IMBRACE_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "[init] waiting for Postgres at $$PGHOST:$$PGPORT..."
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" >/dev/null 2>&1; do sleep 3; done
        echo "[init] ensuring role '$$IMBRACE_USERNAME' (idempotent)..."
        PGPASSWORD="$$PGSUPERPASSWORD" psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" -d postgres -v ON_ERROR_STOP=1 <<SQL
        SELECT 'CREATE ROLE $$IMBRACE_USERNAME LOGIN PASSWORD ''$$IMBRACE_PASSWORD'' CREATEDB'
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$$IMBRACE_USERNAME')\gexec
        SQL
        echo "[init] ensuring database '$$PGDATABASE' (idempotent)..."
        PGPASSWORD="$$PGSUPERPASSWORD" psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" -d postgres -v ON_ERROR_STOP=1 <<SQL
        SELECT 'CREATE DATABASE $$PGDATABASE OWNER $$IMBRACE_USERNAME'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$PGDATABASE')\gexec
        SQL
        echo "[init] done"

  apworkflow-db-migrate:
    image: docker.io/imbraceltd/apwf:dev-be-93efe14
    restart: "no"
    depends_on:
      apworkflow-db-init:
        condition: service_completed_successfully
    environment:
      NX_DAEMON: "false"
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: imbrace-svc-postgresql
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_DATABASE: apworkflowdb
      AP_POSTGRES_USERNAME: imbrace
      AP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
    command: ["/bin/sh", "-c", "echo '[migrate] running server-api:db-migrate ...' && npx nx run server-api:db-migrate && echo '[migrate] done'"]
    networks: [imbrace-net]

