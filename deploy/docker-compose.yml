  # Embeddable chat widget. Entrypoint writes $$WIDGET_ENV to
  # /usr/share/nginx/html/env, then runs /generate-env-json.sh (ECS task-def
  # parity). Published on host :30050 (chart NodePort).
  chat-widget:
    image: docker.io/imbraceltd/imbrace-chat-widget:v0.0.5-e310c76
    container_name: imbrace-svc-chat-widget
    restart: unless-stopped
    depends_on:
      app-gateway:
        condition: service_started
    ports:
      - "30050:3000"
    command: ["/bin/sh", "-c", "printf '%s' \"$$WIDGET_ENV\" > /usr/share/nginx/html/env && exec /generate-env-json.sh"]
    environment:
      APP_GATEWAY_URL: "http://imbrace-svc-app-gateway:9001"
      VITE_APP_API_HOST: "http://imbrace-svc-app-gateway:9001"
      PORT: "3000"
      VITE_APP_CHAT_WIDGET_HOST: "http://imbrace-svc-chat-widget:3000"
      NODE_ENV: "production"
      SKIP_PREFLIGHT_CHECK: "true"
      VITE_APP_ENV: "oss"
      WIDGET_ENV: |-
        SKIP_PREFLIGHT_CHECK=true
        GENERATE_SOURCEMAP=false
        VITE_APP_ENV=oss
        VITE_APP_API_HOST=${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868/api
        VITE_APP_CHAT_WIDGET_HOST=${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30050
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-chat-widget
          - imbrace-svc-chat-widget.imbrace-services

  # ===========================================================================
  # EDGE PROXY — replaces the chart's unified Traefik IngressRoute
  # (templates/apworkflow-ingress.yaml). Single entry point on :6868:
  #   /api/*       -> app-gateway:9001 (prefix /api STRIPPED, like the Traefik
  #                   stripPrefix middleware)
  #   /ws          -> app-gateway:9001 (forwarded unchanged)
  #   /socket.io   -> apworkflow-api:3000 (forwarded unchanged)
  #   /ap-workflow -> apworkflow-api:3000 (forwarded unchanged)
  #   /            -> imbrace-fe:80 (dashboard SPA)
  # ===========================================================================

  edge-proxy:
    image: docker.io/library/nginx:1.27-alpine
    container_name: imbrace-edge-proxy
    restart: unless-stopped
    depends_on:
      imbrace-fe:
        condition: service_started
      app-gateway:
        condition: service_started
      apworkflow-api:
        condition: service_started
    ports:
      - "6868:6868"
    configs:
      - source: edge-proxy-nginx
        target: /etc/nginx/nginx.conf
    networks:
      imbrace-net:

  # ===========================================================================
  # OPTIONAL — GPU model servers (profiles: qwen / gemma4 / embedding).
  # Converted from the ai-vllm-qwen / ai-vllm-gemma4 / ai-vllm-embedding
  # subcharts (all disabled by default in the chart — they need an NVIDIA GPU +
  # models staged under /opt/imbrace/hf_home).
  # chat-ai / ai-agent point at imbrace-svc-ai-vllm-qwen:6976 by default.
  # ===========================================================================

  ai-vllm-qwen:
    <<: *vllm
    profiles: [qwen]
    image: docker.io/vllm/vllm-openai:latest-cu130
    container_name: imbrace-svc-ai-vllm-qwen
    command:
      - "--model"
      - "/opt/imbrace/hf_home/hub/models--Qwen--Qwen3.5-35B-A3B"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
