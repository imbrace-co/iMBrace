  # ===========================================================================
  # AI-AGENT — Next Best Action / aiToolLoopAgent. Uses the shared `postgres`
  # database: db-init grants CREATE to `imbrace`, then db-migrate runs
  # node server/dist/database/migrate.js (chart init container).
  # Container listens on :3000; published on host :30040 (chart NodePort).
  # ===========================================================================

  ai-agent-db-init:
    <<: *db-init
    environment:
      PGHOST: imbrace-svc-postgresql
      PGPORT: "5432"
      PGDATABASE: postgres
      PGSUPERUSER: postgres
      PGSUPERPASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "[init] waiting for Postgres at $$PGHOST:$$PGPORT..."
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" >/dev/null 2>&1; do sleep 3; done
        echo "[init] granting CREATE on $$PGDATABASE / public to imbrace (drizzle migrator)..."
        PGPASSWORD="$$PGSUPERPASSWORD" psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" -d "$$PGDATABASE" -v ON_ERROR_STOP=1 \
          -c "GRANT CREATE ON DATABASE \"$$PGDATABASE\" TO imbrace;" \
          -c "GRANT CREATE, USAGE ON SCHEMA public TO imbrace;"
        echo "[init] done"

  ai-agent-db-migrate:
    image: docker.io/imbraceco/ai-agent:v0.0.1-3bd81f6
    restart: "no"
    depends_on:
      ai-agent-db-init:
        condition: service_completed_successfully
    command: ["node", "server/dist/database/migrate.js"]
    environment: *ai-agent-env
    networks: [imbrace-net]

  ai-agent:
    image: docker.io/imbraceco/ai-agent:v0.0.1-3bd81f6
    container_name: imbrace-svc-ai-agent
    restart: unless-stopped
    depends_on:
      ai-agent-db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "30040:3000"
    # The image's built-in healthcheck runs server/dist/healthcheck.js, which
    # the image does not ship — probe the /health route instead.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment: *ai-agent-env
    volumes:
      - agent-files:/mnt/data/files/aiToolLoopAgent
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-ai-agent
          - imbrace-svc-ai-agent.imbrace-services

  # ===========================================================================
  # APWORKFLOW (Workflow)
  #   db-init    : role `imbrace` + database `apworkflowdb` (post-install hook
  #                parity: templates/apworkflow-db-init-job.yaml)
  #   api        : REST API + engine (AP_CONTAINER_TYPE=WORKER_AND_APP, :3000);
  #                runs its TypeORM migrations itself at boot
  #   app        : React SPA (nginx, :4200)
  #   worker     : flow engine (AP_CONTAINER_TYPE=WORKER, :3001)
  #   proxy      : combined NodePort proxy — host :30700 -> / (app) + /api (api)
  # ===========================================================================

  apworkflow-db-init:
    <<: *db-init
    environment:
      PGHOST: imbrace-svc-postgresql
      PGPORT: "5432"
      PGDATABASE: apworkflowdb
      PGSUPERUSER: postgres
      PGSUPERPASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
      IMBRACE_USERNAME: imbrace
      IMBRACE_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "[init] waiting for Postgres at $$PGHOST:$$PGPORT..."
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" >/dev/null 2>&1; do sleep 3; done
        echo "[init] ensuring role '$$IMBRACE_USERNAME' (idempotent)..."
        PGPASSWORD="$$PGSUPERPASSWORD" psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" -d postgres -v ON_ERROR_STOP=1 <<SQL
        SELECT 'CREATE ROLE $$IMBRACE_USERNAME LOGIN PASSWORD ''$$IMBRACE_PASSWORD'' CREATEDB'
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$$IMBRACE_USERNAME')\gexec
        SQL
        echo "[init] ensuring database '$$PGDATABASE' (idempotent)..."
        PGPASSWORD="$$PGSUPERPASSWORD" psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" -d postgres -v ON_ERROR_STOP=1 <<SQL
        SELECT 'CREATE DATABASE $$PGDATABASE OWNER $$IMBRACE_USERNAME'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$PGDATABASE')\gexec
        SQL
        echo "[init] done"

  # No separate migrate job: the production api bundle ships no Nx workspace
  # and runs its TypeORM migrations itself at boot (migrationsRun: true).
  apworkflow-api:
    image: docker.io/imbraceco/apwf:dev-be-6009262
    container_name: imbrace-svc-apworkflow-api
    restart: unless-stopped
    depends_on:
      apworkflow-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *ap-secrets
      AP_CONTAINER_TYPE: "WORKER_AND_APP"
      AP_DB_TYPE: "POSTGRES"
      AP_POSTGRES_DATABASE: "apworkflowdb"
      AP_POSTGRES_HOST: "imbrace-svc-postgresql"
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_USERNAME: "imbrace"
      AP_EXECUTION_MODE: "UNSANDBOXED"
      AP_REDIS_TYPE: "STANDALONE"
      AP_REDIS_HOST: "imbrace-svc-redis-client"
      AP_REDIS_PORT: "6379"
      AP_REDIS_DB: "0"
      AP_API_KEY: "ap-api-key"
      AP_INTERNAL_URL: "http://imbrace-svc-apworkflow-api:3000/"
      AP_FRONTEND_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30700"
      ENGINE_URL: "http://imbrace-svc-apworkflow-worker:3001"
      AP_ENGINE_WS_PORT: "12345"
      AP_SHARED_PLATFORM_ID: "hVQYqpHY8OpeQbL7FJGnE"
      AP_WEBHOOK_TIMEOUT_SECONDS: "700"
      AP_TRIGGER_DEFAULT_POLL_INTERVAL: "5"
      AP_FLOW_TIMEOUT_SECONDS: "1000"
      AP_WORKER_CONCURRENCY: "10"
      AP_TELEMETRY_ENABLED: "false"
      AP_PIECES_SOURCE: "BUILTIN"
      NX_DAEMON: "false"
      AP_PIECES_SYNC_MODE: "BUILTIN"
      GATEWAY_URL: "http://imbrace-svc-app-gateway:9001/activepieces"
      KAFKA_ENABLED: "true"
      KAFKA_CLIENT_ID: "wcs-producer-imbrace"
      KAFKA_ENDPOINT: "imbrace-svc-kafka:9092"
      KAFKA_USE_SSL: "false"
      KAFKA_USE_SASL: "false"
      KAFKA_SASL_MECHANISM: "plain"
      KAFKA_SASL_USERNAME: ""
      KAFKA_SASL_PASSWORD: ""
      KAFKA_PARTITION: ""
      KAFKA_SSL_REJECT_UNAUTHORIZED: "false"
      KAFKA_IS_AWS_KAFKA: "false"
      KAFKA_CONSUMER_GROUP_ID: "activepieces-flows-stable"
      KAFKA_TOPIC: "AP_INCOMING_MESSAGE,AP_OUTGOING_CRM_EVENT"
      KAFKA_AUTO_COMMIT: "true"
      KAFKA_MAX_BYTES_PER_PARTITION: "1048576"
      KAFKA_FROM_BEGINNING: "true"
      IMBRACE_API_DOMAIN: "http://imbrace-svc-app-gateway:9001"
      IMBRACE_API_OLD_DOMAIN: "https://app-api.your-domain.com"
      IMBRACE_PRIVATE_API: "http://imbrace-svc-platform-service:6040"
      IMBRACE_CHANNEL_API: "http://imbrace-svc-channel-service:4000"
      IMBRACE_DATABOARD_API: "http://imbrace-svc-data-board:8866"
      PLATFORM_SERVICE_API: "http://imbrace-svc-platform-service:6040"
      # ai-agent container listens on 3000 (the k8s Service remapped 80->3000)
      MESSAGE_SUGGESTION_API: "http://imbrace-svc-ai-agent:3000"
      REDIS_HOST: "imbrace-svc-redis-client"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-imbrace-dev-redis-pass}
