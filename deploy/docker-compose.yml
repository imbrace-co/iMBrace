          - imbrace-svc-apworkflow-worker
          - imbrace-svc-apworkflow-worker.imbrace-services

  apworkflow-proxy:
    image: docker.io/library/nginx:1.27-alpine
    container_name: imbrace-svc-apworkflow-proxy
    restart: unless-stopped
    ports:
      - "30700:8080"
    configs:
      - source: apworkflow-proxy-nginx
        target: /etc/nginx/nginx.conf
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-apworkflow-proxy
          - imbrace-apworkflow-proxy

  # ===========================================================================
  # APP GATEWAY — IMBRACE BFF (:9001), reached publicly through the edge proxy
  # at <PUBLIC_HOST>:6868/api (prefix stripped). Licenses persist in a volume
  # (chart: licenses PVC at /app/licenses).
  # ===========================================================================

  app-gateway:
    image: docker.io/imbraceco/app-gateway:v0.0.1-aaf628e
    container_name: imbrace-svc-app-gateway
    restart: unless-stopped
    # The gateway wires its upstreams at startup (chart frontendRedeploy hook
    # parity) — start it after the backends.
    depends_on:
      platform-service:
        condition: service_started
      channel-service:
        condition: service_started
      data-board:
        condition: service_started
      marketplace:
        condition: service_started
      file-service:
        condition: service_started
      chat-ai:
        condition: service_started
      ai-agent:
        condition: service_started
      apworkflow-api:
        condition: service_started
    environment:
      ENV: "production"
      VERSION: "1.0.0"
      PUBLIC_SERVER_PORT: "9001"
      LOG_LEVEL: "info"
      RATELIMIT_WINDOW: "1800000"
      RATELIMIT_MAX_REQUEST_PER_WINDOW: "100"
      BACKEND_PUBLIC_HOST: "http://imbrace-svc-platform-service:6040"
      BACKEND_PRIVATE_HOST: "http://imbrace-svc-platform-service:6040"
      AI_SERVICE: "http://imbrace-svc-chat-ai:8080"
      MARKETPLACE_SERVICE: "http://imbrace-svc-marketplace:4000"
      AI_SERVICE_PYTHON: "http://imbrace-svc-chat-ai:8080"
      AI_SERVICE_CHAT: "http://imbrace-svc-chat-ai:8080"
      AI_CHAT_WEBSOCKET: "http://imbrace-svc-chat-ai:8080"
      image_tag: ""
      log_group: ""
      FILE_SERVICE_HOST: "http://imbrace-svc-file-service:8866"
      DATA_BOARD_HOST: "http://imbrace-svc-data-board:8866"
      DATA_BOARD_PROXY_TOKEN: ""
      DATA_BOARD_PROXY_TIMEOUT_MS: "300000"
      ACTIVEPIECES_BACKEND_HOST: "http://imbrace-svc-apworkflow-api:3000"
      ACTIVEPIECES_ENGINE_HOST: "http://imbrace-svc-apworkflow-worker:3001"
      ACTIVEPIECES_WS_HOST: "http://imbrace-svc-apworkflow-api:3000"
      WORKFLOW_HOST: "http://imbrace-svc-apworkflow-api:3000"
      ACTIVEPIECES_TRUSTED_SOURCES: "localhost,127.0.0.1,${PUBLIC_HOST:-localhost}:6868,${PUBLIC_HOST:-localhost}:30700,imbrace-svc-apworkflow-api,imbrace-svc-apworkflow-api.imbrace-services,*.imbrace.local,imbrace.local,apwf.imbrace.local,apwf.dev.imbrace.lan,apwf.dev.imbrace.co"
      PLATFORM_SERVICE_HOST: "http://imbrace-svc-platform-service:6040"
      CHANNEL_SERVICE_HOST: "http://imbrace-svc-channel-service:4000"
      CHANNEL_SERVICE_ENABLED: "true"
      AUTH_SERVICE_URL: "http://imbrace-svc-platform-service:6040"
      # ai-agent container listens on 3000 (the k8s Service remapped 80->3000)
      MESSAGE_SUGGESTION_HOST: "http://imbrace-svc-ai-agent:3000"
      # Prometheus is no longer part of this stack — point at an external one
      # or leave it: app-gateway degrades to "no metrics".
      PROMETHEUS_HOST: "http://imbrace-prometheus:9090"
      RELEASE_FEED_URL: "https://imbrace-install-tool.s3.ap-east-1.amazonaws.com/oss/latest.json"
      RELEASE_CHECK_STATE_DIR: "/tmp/release-check"
    volumes:
      - licenses:/app/licenses
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-app-gateway
          - imbrace-svc-app-gateway.imbrace-services
          - imbrace-svc-app-gateway.imbrace-services.svc.cluster.local

  # ===========================================================================
  # FRONTENDS
  # ===========================================================================

  # Dashboard SPA (nginx-served Vite build). Runtime config is delivered as ENV
  # VARS (the OSS image writes its own env.json at startup). Served publicly at
  # <PUBLIC_HOST>:6868/ via the edge proxy.
  imbrace-fe:
    image: docker.io/imbraceco/imbrace-fe:v0.0.1-7ae0b9b
    container_name: imbrace-svc-imbrace-fe
    restart: unless-stopped
    depends_on:
      app-gateway:
        condition: service_started
    environment:
      VITE_APP_ENV: "prod"
      VITE_APP_HOST: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868"
      VITE_IS_MULTI_TENANCY: "true"
      VITE_APP_API_HOST: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868/api"
      VITE_APP_API_HOST_OLD: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868/api"
      VITE_APP_AI_HOST: ""
      VITE_APP_INTERNAL_AI_CHAT_HOST: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30030"
      VITE_APP_CHAT_HOST: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30050"
      VITE_APP_API_CHAT_HOST: ""
      VITE_APP_N8N_DOMAIN: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30700"
      VITE_APP_N8N_DOMAIN_V2: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30700"
      VITE_APP_ACTIVEPIECES_DOMAIN: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30700"
      # apworkflow combined proxy (chart: <release>-apworkflow-proxy:80)
      APWF_URL: "http://imbrace-svc-apworkflow-proxy:8080"
      BACKEND_URL: "http://imbrace-svc-app-gateway:9001"
      VITE_APP_ON_PREMISE: "true"
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-imbrace-fe
          - imbrace-svc-imbrace-fe.imbrace-services

  # insightIQ — AI chat SPA (imbrace-ai-chatbot). The image reads env vars at
  # startup and writes its own env.json. Published on host :30030 (chart
  # NodePort) so the dashboard's VITE_APP_INTERNAL_AI_CHAT_HOST is reachable
  # from the browser.
  insightiq:
    image: docker.io/imbraceco/imbrace-ai-chatbot:v0.0.1-e2b7137
    container_name: imbrace-svc-insightiq
    restart: unless-stopped
    depends_on:
      app-gateway:
        condition: service_started
    ports:
      - "30030:3000"
    environment:
      IMBRACE_BASE_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868"
      IMBRACE_APP_GATEWAY_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868"
      IMBRACE_WORKFLOW_DOMAIN: "${PUBLIC_HOST:-localhost}:30700"
      IMBRACE_NEXT_BEST_ACTION_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30040"
      BACKEND: "http://imbrace-svc-app-gateway:9001"
      BACKEND_HOST: "imbrace-svc-app-gateway:9001"
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-insightiq
          - imbrace-svc-insightiq.imbrace-services

  # Embeddable chat widget. Entrypoint writes $$WIDGET_ENV to
  # /usr/share/nginx/html/env, then runs /generate-env-json.sh (ECS task-def
  # parity). Published on host :30050 (chart NodePort).
  chat-widget:
    image: docker.io/imbraceco/imbrace-chat-widget:v0.0.1-31062aa
    container_name: imbrace-svc-chat-widget
    restart: unless-stopped
    depends_on:
      app-gateway:
        condition: service_started
    ports:
      - "30050:3000"
    # The image entrypoint is /generate-env-json.sh: as `command` this line would only
    # be its arguments and WIDGET_ENV would never be written.
    entrypoint: ["/bin/sh", "-c", "printf '%s' \"$$WIDGET_ENV\" > /usr/share/nginx/html/env && exec /generate-env-json.sh"]
    environment:
      APP_GATEWAY_URL: "http://imbrace-svc-app-gateway:9001"
      VITE_APP_API_HOST: "http://imbrace-svc-app-gateway:9001"
      PORT: "3000"
      VITE_APP_CHAT_WIDGET_HOST: "http://imbrace-svc-chat-widget:3000"
      NODE_ENV: "production"
      SKIP_PREFLIGHT_CHECK: "true"
      VITE_APP_ENV: "oss"
      WIDGET_ENV: |-
        SKIP_PREFLIGHT_CHECK=true
        GENERATE_SOURCEMAP=false
        VITE_APP_ENV=oss
        VITE_APP_API_HOST=${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868/api
        VITE_APP_CHAT_WIDGET_HOST=${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30050
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-chat-widget
          - imbrace-svc-chat-widget.imbrace-services

  # ===========================================================================
  # EDGE PROXY — replaces the chart's unified Traefik IngressRoute
  # (templates/apworkflow-ingress.yaml). Single entry point on :6868:
  #   /api/*       -> app-gateway:9001 (prefix /api STRIPPED, like the Traefik
  #                   stripPrefix middleware)
  #   /ws          -> app-gateway:9001 (forwarded unchanged)
  #   /socket.io   -> apworkflow-api:3000 (forwarded unchanged)
  #   /ap-workflow -> apworkflow-api:3000 (forwarded unchanged)
  #   /            -> imbrace-fe:80 (dashboard SPA)
  # ===========================================================================

  edge-proxy:
    image: docker.io/library/nginx:1.27-alpine
    container_name: imbrace-edge-proxy
    restart: unless-stopped
    depends_on:
      imbrace-fe:
        condition: service_started
      app-gateway:
        condition: service_started
      apworkflow-api:
        condition: service_started
    ports:
      - "6868:6868"
    configs:
      - source: edge-proxy-nginx
        target: /etc/nginx/nginx.conf
    networks:
      imbrace-net:

  # ===========================================================================
  # EXAMPLE: customer-request (examples/customer-request) — seeded on first start
  #   customer-request-stub : stub endpoints the example flows call
  #                           (/notify /approvals /business-system; /calls to
  #                           inspect them). Host :30800 on 127.0.0.1 only.
  #   examples-seed         : one-shot job. Imports + publishes the two example
  #                           flows (never overwrites a flow that exists), creates
  #                           the "imbrace-api-key" connection, and creates the AI
  #                           agent "Customer Request Classifier" as soon as an
  #                           LLM provider of type CLASSIFIER_PROVIDER_TYPE exists
  #                           (checks every 30 s, then exits 0).
  #                           SEED_EXAMPLES=false in .env turns it off.
  # Both run the scripts inlined under configs: (block generated by
  # examples/customer-request/scripts/sync-deploy.mjs — edit the example, then
  # re-run that script).
  # ===========================================================================

  customer-request-stub:
    image: docker.io/library/node:20-alpine
    container_name: imbrace-example-stub
    restart: unless-stopped
    command: ["node", "/app/server.js"]
    environment:
      PORT: "8080"
      CALLS_FILE: "/data/calls.jsonl"
    configs:
      - source: example-customer-request-stub
        target: /app/server.js
    volumes:
      - example-stub-data:/data
    ports:
      - "127.0.0.1:30800:8080"
    networks:
      imbrace-net:
        aliases:
          - customer-request-stub

  examples-seed:
    image: docker.io/library/node:20-alpine
    container_name: imbrace-examples-seed
    # Exits 0 when done; restarts only if it failed (e.g. the stack took too long).
    restart: on-failure
    depends_on:
      edge-proxy:
        condition: service_started
      platform-service:
        condition: service_started
      apworkflow-api:
        condition: service_started
      chat-ai:
        condition: service_started
      ai-agent:
        condition: service_started
      marketplace:
        condition: service_started
      customer-request-stub:
        condition: service_started
    environment:
      SEED_EXAMPLES: ${SEED_EXAMPLES:-true}
      # In-network gateway (edge-proxy service name), not the public URL.
      IMBRACE_API: "http://edge-proxy:6868/api"
      # Only printed in the log: the public webhook base of the example flows.
      WORKFLOW_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30700"
      # Must match platform-service NEW_ORG_USERNAME / NEW_ORG_PASSWORD.
      IMBRACE_EMAIL: "admin@imbrace.co"
      IMBRACE_PASSWORD: "ChangeMe@12345"
      CLASSIFIER_PROVIDER_TYPE: ${CLASSIFIER_PROVIDER_TYPE:-bedrock}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-qwen.qwen3-32b-v1:0}
    command: ["node", "/seed/customer-request/scripts/setup.mjs", "--seed", "--wait-api", "--wait-provider"]
    configs:
      - source: example-customer-request-setup
        target: /seed/customer-request/scripts/setup.mjs
      - source: example-customer-request-intake
        target: /seed/customer-request/flows/intake.json
      - source: example-customer-request-reply-router
        target: /seed/customer-request/flows/reply-router.json
      - source: example-customer-request-agent
        target: /seed/customer-request/agents/request-classifier.json
    networks: [imbrace-net]

  # Command-line driver for the example — nothing to install on the host:
  #   docker compose run --rm examples request REQ-1001   # post a request, wait
  #   docker compose run --rm examples reply   REQ-1001   # post the reply -> 202
  #   docker compose run --rm examples approve REQ-1001   # or the Todos page
  #   docker compose run --rm examples result  REQ-1001   # what the business system got
  #   docker compose run --rm examples urls               # the two webhook URLs
  # Profile "tools": not started by `up`, only by `run`.
  examples:
    image: docker.io/library/node:20-alpine
    profiles: [tools]
    entrypoint: ["node", "/seed/customer-request/scripts/cli.mjs"]
    command: ["help"]
    environment:
      IMBRACE_API: "http://edge-proxy:6868/api"
      # Must match platform-service NEW_ORG_USERNAME / NEW_ORG_PASSWORD.
      IMBRACE_EMAIL: "admin@imbrace.co"
      IMBRACE_PASSWORD: "ChangeMe@12345"
      WORKFLOW_INTERNAL_URL: "http://imbrace-svc-apworkflow-proxy:8080"
      WORKFLOW_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30700"
      STUB_URL: "http://customer-request-stub:8080"
    configs:
      - source: example-customer-request-cli
        target: /seed/customer-request/scripts/cli.mjs
      - source: example-customer-request-payload-request
        target: /seed/customer-request/payloads/request.json
      - source: example-customer-request-payload-reply
        target: /seed/customer-request/payloads/reply.json
    networks: [imbrace-net]

# =============================================================================
# INLINE CONFIG FILES
# NOTE: compose interpolates `content`, so every literal `$` is written as `$$`.
# =============================================================================
configs:

  # Converted from templates/postgresql-initdb-cm.yaml
  # (imbrace-svc-postgresql-initdb). Runs once on FIRST cluster init (empty
  # PGDATA), before postgres accepts external connections. Idempotent.
  postgres-initdb:
    content: |
      #!/bin/sh
      set -e

      : "$${IMBRACE_DB_USER:=imbrace}"
      : "$${IMBRACE_DB_PASSWORD:=changeme-postgres-pass}"

      # 00 — app role + grants on the default `imbrace` DB
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d postgres <<EOSQL
      SELECT 'CREATE ROLE $$IMBRACE_DB_USER LOGIN PASSWORD ''$$IMBRACE_DB_PASSWORD'' CREATEDB'
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$$IMBRACE_DB_USER')\gexec

      GRANT ALL PRIVILEGES ON DATABASE imbrace TO $$IMBRACE_DB_USER;
      EOSQL
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d imbrace \
        -c "GRANT ALL ON SCHEMA public TO $$IMBRACE_DB_USER;"

      # 01 — sibling databases (head-start; each service's db-init re-ensures its own)
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d postgres <<EOSQL
      SELECT 'CREATE DATABASE apworkflowdb OWNER $$IMBRACE_DB_USER'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'apworkflowdb')\gexec

      SELECT 'CREATE DATABASE chatai OWNER postgres'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'chatai')\gexec

      SELECT 'CREATE DATABASE databoard OWNER $$IMBRACE_DB_USER'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'databoard')\gexec
      EOSQL

      # 02 — pgvector in chatai
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d chatai \
        -c "CREATE EXTENSION IF NOT EXISTS vector;"

      echo "[initdb] imbrace role + databases + pgvector ready"

  # Garage v2 config — parity with the garage subchart values
  # (db_engine lmdb, replication_factor 1, block_size 1MiB, region "garage").
  garage-config:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"

      replication_factor = 1
      consistency_mode = "consistent"
      compression_level = 1
      block_size = 1048576

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "imbrace-svc-garage:3901"
      # Dev-only fixed secret (the chart auto-generates one). Rotate for prod:
      #   openssl rand -hex 32
      rpc_secret = "3e9c6b0d8a415f27c1d9e8b3a6f40217d5c8e9f1a2b3c4d5e6f708192a3b4c5d"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.imbrace.local"

      [s3_web]
      bind_addr = "[::]:3902"
      root_domain = ".web.imbrace.local"
      index = "index.html"

  # Unified entry point on :6868 (Traefik IngressRoute replacement).
  edge-proxy-nginx:
    content: |
      worker_processes 1;
      error_log /dev/stderr warn;
      pid /tmp/nginx.pid;

      events {
        worker_connections 1024;
      }

      http {
        access_log /dev/stdout;
        sendfile on;
        tcp_nopush on;
        keepalive_timeout 65;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
        client_max_body_size 1g;

        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
        }

        # Resolve upstreams at request time so nginx starts even when app
        # containers aren't up yet (Docker's embedded DNS).
        resolver 127.0.0.11 valid=10s;

        # Dashboard files the image serves without Cache-Control (index.html,
        # /locale/*.json translations, ...) get "no-cache": the browser always
        # revalidates (ETag -> 304) instead of guessing a lifetime from
        # Last-Modified. Without it an upgraded stack kept serving a stale
        # en.json from the browser cache for days, so new pages showed raw
        # translation keys (llm_provider_page_title, ...). Responses that set
        # their own Cache-Control (/assets/ immutable, /config no-store) are
        # left alone; add_header skips an empty value.
        map $$upstream_http_cache_control $$dashboard_cache_control {
          ''      "no-cache";
          default "";
        }

        server {
          listen 6868;
          server_name _;

          set $$gateway   imbrace-svc-app-gateway:9001;
          set $$apwf_api  imbrace-svc-apworkflow-api:3000;
          set $$dashboard imbrace-svc-imbrace-fe:80;

          # /api -> app-gateway, prefix stripped (Traefik stripPrefix parity)
          location = /api {
            rewrite ^ / break;
            proxy_pass http://$$gateway;
            proxy_set_header Host $$host;
          }
          location /api/ {
            rewrite ^/api/(.*)$$ /$$1 break;
            proxy_pass http://$$gateway;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }

          # /ws -> app-gateway, path unchanged (websocket)
          location /ws {
            proxy_pass http://$$gateway;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }

          # /socket.io -> apworkflow API (websocket), path unchanged
          location /socket.io {
            proxy_pass http://$$apwf_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }

          # /ap-workflow -> apworkflow API, path unchanged
          location /ap-workflow {
            proxy_pass http://$$apwf_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          # everything else -> dashboard SPA
          location / {
            proxy_pass http://$$dashboard;
            add_header Cache-Control $$dashboard_cache_control always;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }
        }
      }

  # apworkflow combined proxy — converted from
  # templates/apworkflow-proxy-configmap.yaml. Host :30700 -> / (SPA),
  # /api/ (REST, prefix stripped), /socket.io/ (ws).
  apworkflow-proxy-nginx:
    content: |
      worker_processes 1;
      error_log /dev/stderr warn;
      pid /tmp/nginx.pid;

      events {
        worker_connections 1024;
      }

      http {
        access_log /dev/stdout;
        sendfile on;
        tcp_nopush on;
        keepalive_timeout 65;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
        client_max_body_size 1g;

        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
        }

        client_body_temp_path /tmp/client_body;
        proxy_temp_path       /tmp/proxy;
        fastcgi_temp_path     /tmp/fastcgi;
        uwsgi_temp_path       /tmp/uwsgi;
        scgi_temp_path        /tmp/scgi;

        resolver 127.0.0.11 valid=10s;

        server {
          listen 8080;
          server_name _;

          set $$apwf_api imbrace-svc-apworkflow-api:3000;
          set $$apwf_app imbrace-svc-apworkflow-app:4200;

          location /api/ {
            rewrite ^/api/(.*)$$ /$$1 break;
            proxy_pass http://$$apwf_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }

          location /socket.io/ {
            proxy_pass http://$$apwf_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }

          location / {
            proxy_pass http://$$apwf_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $$host;
            proxy_set_header X-Real-IP         $$remote_addr;
            proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header Upgrade           $$http_upgrade;
            proxy_set_header Connection        $$connection_upgrade;
          }
        }
      }

  # >>> customer-request example (generated by examples/customer-request/scripts/sync-deploy.mjs, do not edit)

  # scripts/setup.mjs
  example-customer-request-setup:
    content: |
      // Imports the example flows into iMBrace Workflow, publishes and enables them.
      // Node 18+, no dependencies. Writes the webhook URLs to scripts/.state.json.
      //
      //   node scripts/setup.mjs                 create the AI agent, import (or update) both flows
      //   node scripts/setup.mjs --state-only    only look the flows up and write .state.json
      //
      // The CE stack (deploy/docker-compose.yml) runs it as the examples-seed service with
      //   --seed           never overwrite a flow that already exists, do not write .state.json;
      //                    SEED_EXAMPLES=false makes it exit without doing anything
      //   --wait-api       retry until the stack answers (fresh install)
      //   --wait-provider  without an LLM provider, import the flows anyway, then check every
      //                    30 s and create the AI agent as soon as a provider is added
      import { readFileSync, writeFileSync } from 'node:fs';
      import { dirname, join } from 'node:path';
      import { fileURLToPath } from 'node:url';

      const here = dirname(fileURLToPath(import.meta.url));
      const root = join(here, '..');
      const env = (k, d) => process.env[k] ?? d;
      const flags = new Set(process.argv.slice(2));
      const SEED = flags.has('--seed');
      const WAIT_API = flags.has('--wait-api');
      const WAIT_PROVIDER = flags.has('--wait-provider');
      const STATE_ONLY = flags.has('--state-only');

      const GATEWAY = env('IMBRACE_API', 'http://127.0.0.1:6868/api');
      const WORKFLOW_PUBLIC = env('WORKFLOW_URL', 'http://127.0.0.1:30700');
      const EMAIL = env('IMBRACE_EMAIL', 'admin@imbrace.co');
      const PASSWORD = env('IMBRACE_PASSWORD', 'ChangeMe@12345');

      const CLASSIFIER_PROVIDER_TYPE = env('CLASSIFIER_PROVIDER_TYPE', 'bedrock');
      const CLASSIFIER_MODEL = env('CLASSIFIER_MODEL', 'qwen.qwen3-32b-v1:0');
      const CLASSIFIER_PLACEHOLDER = '__CLASSIFIER_ASSISTANT_ID__';

      const FLOWS = [
        { key: 'intake', file: 'flows/intake.json' },
        { key: 'replyRouter', file: 'flows/reply-router.json' },
      ];

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      async function call(method, path, { token, body, orgId } = {}) {
        const res = await fetch(`$${GATEWAY}$${path}`, {
          method,
          headers: {
            'content-type': 'application/json',
            ...(token ? { 'x-access-token': token } : {}),
            ...(orgId ? { 'x-organization-id': orgId } : {}),
          },
          body: body ? JSON.stringify(body) : undefined,
        });
        const text = await res.text();
        if (!res.ok) throw new Error(`$${method} $${path} -> $${res.status} $${text.slice(0, 300)}`);
        return text ? JSON.parse(text) : {};
      }

      async function accessToken() {
        const login = await call('POST', '/platform/v1/login/sign_in', {
          body: { email: EMAIL, password: PASSWORD },
        });
        const orgs = await call('GET', '/platform/v2/organizations', { token: login.token });
        const org = orgs.data?.[0];
        if (!org) throw new Error('no organization found for this user');
        const fresh = await call('POST', '/platform/v1/login/sign_in', {
          body: { email: EMAIL, password: PASSWORD },
        });
        const acc = await call('POST', '/platform/v1/access/_exchange_access_token', {
          token: fresh.token,
          body: { organization_id: org.id },
        });
        return { token: acc.token, organizationId: org.id };
      }

      // Login plus the workflow project of the organization.
      async function session() {
        const { token, organizationId } = await accessToken();
        const me = await call('GET', '/activepieces/v1/users/me', { token });
        if (!me.projectId) throw new Error('the workflow project of this organization is not ready');
        return { token, organizationId, projectId: me.projectId };
      }

      // On a fresh install the services come up one by one; keep trying for up to 10 minutes,
      // until the AI service (chat-ai) and the marketplace answer too.
      async function sessionWhenReady() {
        const deadline = Date.now() + 10 * 60_000;
        for (;;) {
          try {
            const s = await session();
            if (WAIT_API) {
              await call('GET', '/ai/v3/providers', { token: s.token, orgId: s.organizationId });
              await call('GET', '/v3/marketplaces/use-cases', { token: s.token, orgId: s.organizationId });
            }
            return s;
          } catch (e) {
            if (!WAIT_API || Date.now() > deadline) throw e;
            console.log(`waiting for the iMBrace API ($${e.message.split('\n')[0].slice(0, 120)})`);
            await sleep(10_000);
          }
        }
      }

      async function findProvider(token, orgId) {
        const providers = await call('GET', '/ai/v3/providers', { token, orgId });
        return (providers.data ?? providers).find((p) => p.type === CLASSIFIER_PROVIDER_TYPE);
      }

      // The flow's AI step calls an iMBrace AI agent. It is created the way the dashboard creates
      // one (a marketplace use case wrapping the assistant), so it shows on the AI Agent page.
      // Returns null when there is no LLM provider yet and --wait-provider is set.
      async function ensureClassifier(token, orgId) {
        const agent = JSON.parse(readFileSync(join(root, 'agents/request-classifier.json'), 'utf8'));
        const useCases = await call('GET', '/v3/marketplaces/use-cases', { token, orgId });
        const existing = (useCases.data ?? useCases).find((u) => u.title === agent.name && u.type === 'custom');
        if (existing) {
          await removeStandaloneCopies(token, orgId, agent.name, existing.assistant_id);
          return existing.assistant_id;
        }
        const provider = await findProvider(token, orgId);
        if (!provider) {
          if (WAIT_PROVIDER) return null;
          throw new Error(
            `no "$${CLASSIFIER_PROVIDER_TYPE}" LLM provider in this organization. ` +
              'Add one in the dashboard (LLM Provider page) first, or set CLASSIFIER_PROVIDER_TYPE.',
          );
        }
        const assistantId = await createClassifier(token, orgId, agent, provider);
        await removeStandaloneCopies(token, orgId, agent.name, assistantId);
        return assistantId;
      }

      async function createClassifier(token, orgId, agent, provider) {
        // The dashboard points the agent's demo link at the chat widget; read its URL from the dashboard config.
        const dashboardConfig = await fetch(`$${new URL(GATEWAY).origin}/config`).then((r) => r.json()).catch(() => ({}));
        const workflowName = `Standard | $${agent.name}`;
        const created = await call('POST', '/v3/marketplaces/use-cases/v2/custom', {
          token,
          orgId,
          body: {
            usecase: {
              title: agent.name,
              short_description: agent.description,
              demo_url: dashboardConfig.VITE_APP_CHAT_HOST ?? '',
              supported_channels: [],
              agent_type: 'agent',
            },
            assistant: {
              ...agent,
              model_id: CLASSIFIER_MODEL,
              provider_id: provider.id,
              workflow_name: workflowName,
              credential_name: workflowName,
              agent_type: 'agent',
              version: 2,
              category: [],
              metadata: {},
              file_ids: [],
              folder_ids: [],
              board_ids: [],
              knowledge_hubs: [],
              workflow_function_call: [],
            },
          },
        });
        console.log(`created AI agent "$${agent.name}" ($${CLASSIFIER_MODEL} on $${provider.name})`);
        return created.data.assistant_id;
      }

      // Earlier versions of this script created the assistant without a use case, so it never showed
      // on the AI Agent page. Remove such leftovers with the same name.
      async function removeStandaloneCopies(token, orgId, name, keepId) {
        const list = await call('GET', '/ai/v3/accounts/assistants?limit=1000', { token, orgId });
        for (const a of list.data ?? list) {
          const id = a.id ?? a.assistant_id;
          if (a.name === name && id !== keepId) {
            await call('DELETE', `/ai/v3/assistant_apps/$${id}`, { token, orgId });
            console.log(`removed old standalone AI agent $${id}`);
          }
        }
      }

      // The AI step runs from a plain webhook, so it authenticates with an organization API key
      // kept in a workflow connection. Created once; re-runs reuse the existing connection.
      const CONNECTION_NAME = 'imbrace-api-key';
      async function ensureApiKeyConnection(token, orgId, projectId) {
        const existing = await call('GET', `/activepieces/v1/app-connections?projectId=$${projectId}&limit=100`, { token });
        if ((existing.data ?? []).some((c) => c.externalId === CONNECTION_NAME)) return;

        const created = await call('POST', '/platform/v1/third_party_token', {
          token,
          orgId,
          body: { name: 'workflow: customer-request example' },
        });
        const apiKey = created.apiKey?._id;
        if (!apiKey) throw new Error('could not create an organization API key');
        await call('POST', '/activepieces/v1/app-connections', {
          token,
          body: {
            externalId: CONNECTION_NAME,
            displayName: 'iMBrace API key',
            pieceName: '@activepieces/piece-ai-connector',
            projectId,
            type: 'SECRET_TEXT',
            value: { type: 'SECRET_TEXT', secret_text: apiKey },
          },
        });
        console.log(`created API key connection "$${CONNECTION_NAME}"`);
      }

      function readFlow(file, { classifierId, organizationId }) {
        let text = readFileSync(join(root, file), 'utf8').replaceAll('__ORGANIZATION_ID__', organizationId);
        if (classifierId) text = text.replaceAll(CLASSIFIER_PLACEHOLDER, classifierId);
        return JSON.parse(text);
      }

      function flowState(flow, displayName) {
        return { id: flow.id, displayName, webhookUrl: `$${WORKFLOW_PUBLIC}/api/v1/webhooks/$${flow.id}` };
      }

      // In --seed mode a flow that already exists is left alone (it may have been edited in the UI),
      // unless it still waits for the AI agent and the agent now exists.
      async function keepExisting(token, flow, classifierId) {
        if (!SEED) return false;
        if (!classifierId) return true;
        const current = await call('GET', `/activepieces/v1/flows/$${flow.id}`, { token });
        return !JSON.stringify(current.version ?? {}).includes(CLASSIFIER_PLACEHOLDER);
      }

      async function importFlows({ token, organizationId, projectId }, classifierId) {
        const existing = await call('GET', '/activepieces/v1/flows?limit=100', { token });
        const flows = {};
        for (const { key, file } of FLOWS) {
          const def = readFlow(file, { classifierId, organizationId });
          let flow = existing.data.find((f) => f.version?.displayName === def.displayName);
          if (flow && (await keepExisting(token, flow, classifierId))) {
            flows[key] = flowState(flow, def.displayName);
            console.log(`$${def.displayName}: $${flows[key].webhookUrl} (already there, kept as is)`);
            continue;
          }
          if (flow && flow.status === 'ENABLED') {
            await call('POST', `/activepieces/v1/flows/$${flow.id}`, {
              token,
              body: { type: 'CHANGE_STATUS', request: { status: 'DISABLED' } },
            });
          }
          if (!flow) {
            flow = await call('POST', '/activepieces/v1/flows', {
              token,
              body: { displayName: def.displayName, projectId },
            });
          }
          await call('POST', `/activepieces/v1/flows/$${flow.id}`, {
            token,
            body: { type: 'IMPORT_FLOW', request: def },
          });
          await call('POST', `/activepieces/v1/flows/$${flow.id}`, {
            token,
            body: { type: 'LOCK_AND_PUBLISH', request: {} },
          });
          await call('POST', `/activepieces/v1/flows/$${flow.id}`, {
            token,
            body: { type: 'CHANGE_STATUS', request: { status: 'ENABLED' } },
          });
          flows[key] = flowState(flow, def.displayName);
          console.log(`$${def.displayName}: $${flows[key].webhookUrl}`);
        }
        return flows;
      }

      async function lookUpFlows({ token }) {
        const existing = await call('GET', '/activepieces/v1/flows?limit=100', { token });
        const flows = {};
        for (const { key, file } of FLOWS) {
          const { displayName } = JSON.parse(readFileSync(join(root, file), 'utf8'));
          const flow = existing.data.find((f) => f.version?.displayName === displayName);
          if (!flow) throw new Error(`flow "$${displayName}" not found; run "node scripts/setup.mjs" to import it`);
          flows[key] = flowState(flow, displayName);
          console.log(`$${displayName}: $${flows[key].webhookUrl}`);
        }
        return flows;
      }

      function saveState(state) {
        writeFileSync(join(here, '.state.json'), JSON.stringify(state, null, 2) + '\n');
        console.log(`saved $${join('scripts', '.state.json')}`);
      }

      async function main() {
        if (SEED && /^(false|0|no|off)$$/i.test(env('SEED_EXAMPLES', 'true'))) {
          console.log('SEED_EXAMPLES is off, nothing to do');
          return;
        }
        const s = await sessionWhenReady();

        if (STATE_ONLY) {
          const flows = await lookUpFlows(s);
          saveState({ organizationId: s.organizationId, projectId: s.projectId, flows });
          return;
        }

        let classifierId = await ensureClassifier(s.token, s.organizationId);
        await ensureApiKeyConnection(s.token, s.organizationId, s.projectId);
        let flows = await importFlows(s, classifierId);

        if (!classifierId) {
          console.log(
            `no "$${CLASSIFIER_PROVIDER_TYPE}" LLM provider yet: the flows are imported, the AI step needs the agent. ` +
              'Add a provider in the dashboard (LLM Provider page); the agent is created within 30 seconds.',
          );
          while (!classifierId) {
            await sleep(30_000);
            const fresh = await sessionWhenReady(); // the access token may have expired meanwhile
            Object.assign(s, fresh);
            if (!(await findProvider(s.token, s.organizationId))) continue;
            classifierId = await ensureClassifier(s.token, s.organizationId);
          }
          flows = await importFlows(s, classifierId);
        }

        if (!SEED) saveState({ organizationId: s.organizationId, projectId: s.projectId, classifierId, flows });
        console.log('customer-request example is ready');
      }

      main().catch((e) => {
        console.error(e.message);
        process.exit(1);
      });

