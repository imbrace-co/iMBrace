# =============================================================================
# IMBRACE OSS — single-file docker-compose deployment
#
# Consolidated from imbrace-deploy-oss/docker-compose-imbrace/ (which had one
# compose file per service) into ONE self-contained file: every sidecar config
# (nginx, garage.toml, postgres initdb) is inlined as a compose `config`, so
# no companion files are needed.
#
# Images come from the public docker.io/imbraceco registry (no pull secret).
# apwf:dev-{be,fe,engine}-6009262, app-gateway:v0.0.1-aaf628e,
# chat-ai:v0.0.1-1acceca and ai-agent:v0.0.1-3bd81f6 carry the fixes the
# customer-request example needs (Wait for Event / Resume Waiting Run, AI
# connector API key, Todos, masked provider keys); all are linux/amd64 + arm64.
#
# REQUIREMENTS: Docker Engine 24+ and Docker Compose v2.23.1+
#               (inline `configs[].content` support).
#
# -----------------------------------------------------------------------------
# QUICK START
# -----------------------------------------------------------------------------
#   cd deploy
#   sh generate-env.sh         # once: writes random AP_* keys into .env
#   docker compose up -d
#   docker compose ps
#
# Point the stack at a real host (instead of localhost) either with a .env file
# next to this one, or inline:
#   PUBLIC_HOST=10.0.0.5 docker compose up -d
#
# Stop / wipe:
#   docker compose down                      # stop
#   docker compose down -v                   # stop + delete all data volumes
#
# The customer-request example (examples/customer-request) is installed on
# first start by the examples-seed service: its two flows appear in FlowOps ->
# Workflows, its stub endpoints listen on 127.0.0.1:30800. Add an LLM provider
# (dashboard -> LLM Provider) and the AI agent it needs is created within 30 s.
#   docker logs -f imbrace-examples-seed     # what the seed did / is waiting for
#   docker compose run --rm examples-seed    # run it again
# Try it (nothing to install on the host, works the same in cmd / PowerShell):
#   docker compose run --rm examples request REQ-1001   # then: reply / approve / result
#
# -----------------------------------------------------------------------------
# SUPPORTED .env VARIABLES
# -----------------------------------------------------------------------------
#   AP_ENCRYPTION_KEY=            # REQUIRED, 32 hex chars (openssl rand -hex 16)
#   AP_JWT_SECRET=                # REQUIRED, 64 hex chars (openssl rand -hex 32)
#                                 # both generated by sh generate-env.sh
#   PUBLIC_HOST=localhost         # browser-facing IP/DNS, no scheme, no port
#   PUBLIC_SCHEME=http            # http | https
#   WS_SCHEME=ws                  # ws when http, wss when https
#   POSTGRES_PASSWORD=changeme-postgres-pass
#   REDIS_PASSWORD=imbrace-dev-redis-pass
#   INTERNAL_SERVICE_KEY=oss-dociq-key   # ai-agent -> chat-ai, unmasked provider credentials
#   GARAGE_KEY_ID=                # filled after the garage bootstrap below
#   GARAGE_KEY_SECRET=
#   OPENAI_API_KEY=
#   TAVILY_API_KEY=
#   SEED_EXAMPLES=true            # false: do not install the customer-request example
#   CLASSIFIER_PROVIDER_TYPE=bedrock      # LLM provider type the example's AI agent uses
#   CLASSIFIER_MODEL=qwen.qwen3-32b-v1:0  # model of that provider
#
# -----------------------------------------------------------------------------
# PUBLISHED PORTS
# -----------------------------------------------------------------------------
#   6868   Dashboard + /api (edge-proxy)   login admin@imbrace.co / ChangeMe@12345
#   30700  apworkflow (Workflow)
#   30040  ai-agent (Next Best Action)
#   30030  insightIQ AI chat
#   30050  chat widget
#   30800  customer-request example stub (127.0.0.1 only)
#
# -----------------------------------------------------------------------------
# ONE-TIME GARAGE (S3) BOOTSTRAP — optional
# -----------------------------------------------------------------------------
# Services default to local storage, so this can be done later. Run once after
# `up -d` (equivalent of the chart's garage-bootstrap-job):
#
#   G="docker exec imbrace-svc-garage /garage"
#   NODE_ID=$($G status | awk '/^[0-9a-f]{16}/ {print $1; exit}')
#   $G layout assign -z dc1 -c 5G "$NODE_ID"
#   $G layout apply --version 1
#   $G bucket create imbrace
#   $G key create imbrace-app          # prints Key ID + Secret key -> .env
#   $G bucket allow imbrace --read --write --owner --key imbrace-app
#
# Then put the printed key id/secret into .env as GARAGE_KEY_ID /
# GARAGE_KEY_SECRET and `docker compose up -d` again.
#
# -----------------------------------------------------------------------------
# BEFORE PRODUCTION
# -----------------------------------------------------------------------------
# - Rotate: POSTGRES_PASSWORD, REDIS_PASSWORD, INTERNAL_SERVICE_KEY, NEW_ORG_PASSWORD
#   (platform-service) and the garage rpc_secret (config `garage-config`
#   below). The AP_* keys have no default — `up` refuses to start without them.
#   Changing POSTGRES_PASSWORD after the first run also needs
#   an `ALTER ROLE` inside Postgres — initdb only runs once.
# - SMTP (mailgun) ships with an empty password; fill SMTP_PASSWORD /
#   SERVICE_MAIL_API_KEY if email egress is needed.
# - Internal hostnames keep the Helm chart convention (imbrace-svc-*, plus an
#   imbrace-svc-*.imbrace-services alias) so env values stay ~1:1 with
#   values.yaml. Differences: ai-agent is addressed on :3000 (the k8s Service
#   remapped 80->3000) and the apworkflow proxy on :8080.
# - MongoDB is disabled in the chart (mongodb.enabled=false) and not converted.
#   The imbrace-svc-ips / onserver.*.imbrace.lan endpoints are kept verbatim
#   from the chart (no matching service here).
# =============================================================================
name: imbrace

# --- shared fragments --------------------------------------------------------

# Base for every one-shot DB init job (Helm post-install hook parity).
x-db-init: &db-init
  image: postgres:18-alpine
  restart: "no"
  depends_on:
    postgresql:
      condition: service_healthy
  networks: [imbrace-net]

x-ap-secrets: &ap-secrets
  AP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
  AP_REDIS_PASSWORD: ${REDIS_PASSWORD:-imbrace-dev-redis-pass}
  # No defaults on purpose: a key shipped in this file would be shared by every
  # install. AP_ENCRYPTION_KEY encrypts stored connection credentials and
  # AP_JWT_SECRET signs every Workflow token. Generate both with
  # sh generate-env.sh. AP_WORKER_TOKEN is not set: the api runs as
  # WORKER_AND_APP and signs its own worker token with AP_JWT_SECRET.
  AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:?AP_ENCRYPTION_KEY is not set - run sh generate-env.sh first}
  AP_JWT_SECRET: ${AP_JWT_SECRET:?AP_JWT_SECRET is not set - run sh generate-env.sh first}

x-ai-agent-env: &ai-agent-env
  NODE_ENV: "production"
  PORT: "3000"
  # vLLM is no longer part of this stack — these must point at an external
  # OpenAI-compatible endpoint for the AI features to work.
  VLLM_URL: "http://imbrace-svc-ai-vllm-qwen:6976/v1"
  VLLM_BASE_URL: "http://imbrace-svc-ai-vllm-qwen:6976/v1"
  LLM_PROVIDER: "vllm"
  AI_PROVIDER: "vllm"
  BUILTIN_AGENT_PROVIDER_ID: "vllm"
  BUILTIN_AGENT_MODEL_ID: "auto"
  VLLM_MODEL_ID: "qwen3.5-35b-a3b"
  SUGGESTION_MODEL_ID: "qwen3.5-35b-a3b"
  SUGGESTION_MODEL_PROVIDER_TYPE: "vllm"
  SUGGESTION_MODEL_PROVIDER_URL: "http://imbrace-svc-ai-vllm-qwen:6976/v1"
  MONGODB_URI: ""
  MONGODB_OPENAI_URI: ""
  MONGODB_DB_NAME: ""
  AWS_ACCESS_KEY_ID: ${GARAGE_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${GARAGE_KEY_SECRET:-}
  AWS_REGION_AI: "us-west-2"
  AWS_S3_BUCKET: "imbrace"
  AWS_REGION_S3: "garage"
  AWS_ENDPOINT_URL_S3: "http://imbrace-svc-garage:3900"
  AWS_ENDPOINT_URL: "http://imbrace-svc-garage:3900"
  S3_ENDPOINT: "http://imbrace-svc-garage:3900"
  S3_FORCE_PATH_STYLE: "true"
  AWS_S3_FORCE_PATH_STYLE: "true"
  DUCKDB_THREADS: "4"
  REDIS_ENABLED: "true"
  REDIS_URL: "redis://:${REDIS_PASSWORD:-imbrace-dev-redis-pass}@imbrace-svc-redis-client:6379"
  CONTEXT_COMPACT_THRESHOLD: "2000"
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_PROXY_URL: "https://ai-proxy.demo.imbrace.co/v1"
  EMBEDDING_MODEL: "text-embedding-3-small"
  EMBEDDING_BASE_URL: ""
  EMBEDDING_TYPE: "openai"
  WEB_APP_URL: "http://imbrace-svc-app-gateway:9001"
  WEB_APP_API_URL: "http://imbrace-svc-app-gateway:9001"
  APPGATEWAY: "api/v1"
  CORS_ORIGINS: ""
  PRODUCTION_CORS_ORIGINS: ""
  AI_CHAT_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:30030"
  MODEL_ID: "qwen.qwen3-32b-v1:0"
  APP_GATEWAY_URL: "http://imbrace-svc-app-gateway:9001"
  AISDK_CHAT_CLIENT_POSTGRES_URL: "postgresql://imbrace:${POSTGRES_PASSWORD:-changeme-postgres-pass}@imbrace-svc-postgresql:5432/postgres"
  WORKFLOW_URL: "http://imbrace-svc-apworkflow-api:3000"
  IPS_URL: "http://imbrace-svc-ips:6666"
  AI_SERVICE_V2_INTERNAL_URL: "http://imbrace-svc-chat-ai:8080"
  DOCIQ_INGEST_ENABLED: "true"
  # Also chat-ai's INTERNAL_SERVICE_KEY: lets ai-agent read unmasked provider credentials.
  AI_SERVICE_V2_API_KEY: "${INTERNAL_SERVICE_KEY:-oss-dociq-key}"
  KAFKA_BROKERS: "imbrace-svc-kafka:9092"
  KAFKA_CLIENT_ID: "messagesuggestion"
  KAFKA_GROUP_ID: "messagesuggestion-dociq-dev"
  KAFKA_USE_SSL: "false"
  KAFKA_USE_SASL: "false"
  KAFKA_SASL_MECHANISM: "plain"
  KAFKA_SASL_USERNAME: ""
  KAFKA_SASL_PASSWORD: ""
  KAFKA_USE_SSL_REJECT_UNAUTHORIZED: "false"
  STORAGE_TYPE: "local"
  FILE_PATH: "/mnt/data/files/aiToolLoopAgent/"
  ACTIVEPIECE_URL: "http://imbrace-svc-apworkflow-api:3000"
  DATA_BOARD_URL: "http://imbrace-svc-data-board:8866"

services:

  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  # PostgreSQL 18 + pgvector (from the `postgresql` subchart). The inlined
  # initdb script mirrors templates/postgresql-initdb-cm.yaml and runs ONCE on
  # first start (empty volume) — remove the pgdata volume to re-init.
  postgresql:
    image: pgvector/pgvector:pg18
    container_name: imbrace-svc-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
      POSTGRES_DB: imbrace
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # Workflow issues CREATE COLLATION ... PROVIDER='icu' at boot — the
      # cluster must be initdb'd with the ICU locale provider (chart parity).
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8 --locale-provider=icu --icu-locale=en-US"
      # Consumed by the initdb script (imbrace app role).
      IMBRACE_DB_USER: imbrace
      IMBRACE_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/18/docker and
      # refuse to start when a volume is mounted at the old .../data path.
      - pgdata:/var/lib/postgresql
    configs:
      - source: postgres-initdb
        target: /docker-entrypoint-initdb.d/00-init.sh
    # Uncomment to reach Postgres from the host (debugging only):
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-postgresql
          - imbrace-svc-postgresql.imbrace-services

  # Redis (from the `redis` subchart, standalone, auth enabled). The chart's
  # client Service is imbrace-svc-redis-client — kept as an alias because every
  # consumer's REDIS_HOST points at it.
  redis:
    image: docker.io/library/redis:8.6.2
    container_name: imbrace-svc-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-imbrace-dev-redis-pass}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-imbrace-dev-redis-pass}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-imbrace-dev-redis-pass}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-redis
          - imbrace-svc-redis-client
          - imbrace-svc-redis-client.imbrace-services

  # Kafka (from the `kafka` subchart). The chart runs a 3-node combined-mode
  # cluster; here it is a single combined broker+controller (dev sizing).
  # Clients connect PLAINTEXT, no SASL/SSL. Topics auto-create.
  kafka:
    image: docker.io/apache/kafka:4.2.0
    container_name: imbrace-svc-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@imbrace-svc-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://imbrace-svc-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Chart config parity (kafka.config.*)
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      # Single node → replication factor 1 for internal topics
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:+ExplicitGCInvokesConcurrent -XX:MaxInlineLevel=15 -Djava.awt.headless=true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-kafka
          - imbrace-svc-kafka.imbrace-services

  # Garage — S3-compatible object store (from the `garage` subchart, single
  # node, replication_factor=1, lmdb). S3 API :3900, S3 web :3902, in-network
  # only. See the GARAGE BOOTSTRAP block in the header for the one-time setup.
  garage:
    image: docker.io/dxflrs/garage:v2.2.0
    container_name: imbrace-svc-garage
    restart: unless-stopped
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    configs:
      - source: garage-config
        target: /etc/garage.toml
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-garage
          - imbrace-svc-garage.imbrace-services

  # ===========================================================================
  # PLATFORM SERVICE — org/user/auth. Seeds the first org + admin from
  # NEW_ORG_USERNAME / NEW_ORG_PASSWORD. In-network only (:6040).
  # ===========================================================================

  platform-db-init:
    <<: *db-init
    environment:
      PGHOST: imbrace-svc-postgresql
      PGPORT: "5432"
      PGDATABASE: platform
      PGSUPERUSER: postgres
      PGSUPERPASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "[init] waiting for Postgres at $$PGHOST:$$PGPORT..."
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" >/dev/null 2>&1; do sleep 3; done
        echo "[init] ensuring database '$$PGDATABASE' (idempotent)..."
        PGPASSWORD="$$PGSUPERPASSWORD" psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" -d postgres -v ON_ERROR_STOP=1 <<SQL
        SELECT 'CREATE DATABASE $$PGDATABASE OWNER $$PGSUPERUSER'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$PGDATABASE')\gexec
        SQL
        echo "[init] done"

  platform-service:
    image: docker.io/imbraceco/platform:v0.0.1-0b72c24
    container_name: imbrace-svc-platform-service
    restart: unless-stopped
    depends_on:
      platform-db-init:
        condition: service_completed_successfully
    environment:
      PORT: "6040"
      NODE_ENV: "production"
      DB_TYPE: "postgres"
      NEW_ORG_NAME: ""
      NEW_ORG_USERNAME: "admin@imbrace.co"
      NEW_ORG_PASSWORD: "ChangeMe@12345"
      IMBRACE_USERNAME: ""
      IMBRACE_PASSWORD: ""
      SUPERADMIN_EMAILS: ""
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-changeme-postgres-pass}@imbrace-svc-postgresql:5432/platform"
      DESTINATION_POSTGRES_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-changeme-postgres-pass}@imbrace-svc-postgresql:5432/platform"
      SERVICE_CHANNEL: "http://imbrace-svc-channel-service:4000"
      SERVICE_AI: "http://imbrace-svc-chat-ai:8080"
      SERVICE_DATA_BOARD: "http://imbrace-svc-data-board:8866"
      SERVICE_MARKET_PLACE: "http://imbrace-svc-marketplace:4000"
      ORG_DEFAULT_IS_PAID: "true"
      APP_API_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868/api/platform"
      APP_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868"
      AWS_REGION: "ap-east-1"
      AWS_S3_BUCKET: "imbrace-uat"
      AWS_S3_BUCKET_PREFIX: "prod"
      SMTP_ADDRESS: "smtp.mailgun.org"
      SMTP_PORT: "587"
      SMTP_USERNAME: "postmaster@imbrace.co"
      SMTP_SENDER: "noreply@imbrace.co"
      SMTP_PASSWORD: ""
      EMAIL_EGRESS: "mail-service"
      SERVICE_MAIL: "https://imbrace-api.imbrace.co"
      SERVICE_MAIL_API_KEY: ""
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-platform-service
          - imbrace-svc-platform-service.imbrace-services

  # ===========================================================================
  # FILE SERVICE — REST upload/download. STORAGE MODE = LOCAL: uploads persist
  # in the file-data volume at /data (chart: file-service-data PVC).
  # In-network only (:8866).
  # ===========================================================================

  file-db-init:
    <<: *db-init
    environment:
      PGHOST: imbrace-svc-postgresql
      PGPORT: "5432"
      PGDATABASE: fileservice
      PGSUPERUSER: postgres
      PGSUPERPASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "[init] waiting for Postgres at $$PGHOST:$$PGPORT..."
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" >/dev/null 2>&1; do sleep 3; done
        echo "[init] ensuring database '$$PGDATABASE' (idempotent)..."
        PGPASSWORD="$$PGSUPERPASSWORD" psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" -d postgres -v ON_ERROR_STOP=1 <<SQL
        SELECT 'CREATE DATABASE $$PGDATABASE OWNER $$PGSUPERUSER'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$PGDATABASE')\gexec
        SQL
        echo "[init] done"

  file-service:
    image: docker.io/imbraceco/file:v0.0.1-8aa725c
    container_name: imbrace-svc-file-service
    restart: unless-stopped
    depends_on:
      file-db-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: "file-service"
      DB_TYPE: "postgres"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-changeme-postgres-pass}@imbrace-svc-postgresql:5432/fileservice"
      NODE_ENV: "dev"
      PORT: "8866"
      MONGO_URI: ""
      # LOCAL_PATH set => local storage adapter; S3 keys below stay inert
      LOCAL_PATH: "/data/"
      FILE_PATH: "/data"
      FILE_PUBLIC_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868/v1/files"
      SERVICE_BASE_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:6868"
      S3_BUCKET_NAME: ""
      S3_URL: ""
      S3_ENDPOINT: ""
      S3_FORCE_PATH_STYLE: "false"
      AWS_REGION: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_ENDPOINT_URL_S3: ""
      AWS_ENDPOINT_URL: ""
      AWS_S3_FORCE_PATH_STYLE: "false"
    volumes:
      - file-data:/data
      - file-logs:/app/logs
    networks:
      imbrace-net:
        aliases:
          - imbrace-svc-file-service
          - imbrace-svc-file-service.imbrace-services

  # ===========================================================================
  # CHANNEL SERVICE — FB/IG/WhatsApp connectors. The app runs its own drizzle
  # migrations at boot. In-network only (:4000).
  # ===========================================================================

  channel-db-init:
    <<: *db-init
    environment:
      PGHOST: imbrace-svc-postgresql
      PGPORT: "5432"
      PGDATABASE: channel_service
      PGSUPERUSER: postgres
      PGSUPERPASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-pass}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "[init] waiting for Postgres at $$PGHOST:$$PGPORT..."
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" >/dev/null 2>&1; do sleep 3; done
        echo "[init] ensuring database '$$PGDATABASE' (idempotent)..."
        PGPASSWORD="$$PGSUPERPASSWORD" psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGSUPERUSER" -d postgres -v ON_ERROR_STOP=1 <<SQL
        SELECT 'CREATE DATABASE $$PGDATABASE OWNER $$PGSUPERUSER'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$PGDATABASE')\gexec
        SQL
        echo "[init] done"

  channel-service:
    image: docker.io/imbraceco/channel:v0.0.1-d1ee5b0
    container_name: imbrace-svc-channel-service
    restart: unless-stopped
    depends_on:
      channel-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: "4000"
      NODE_ENV: "production"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      DB_TYPE: "postgres"
      DB_HOST: "imbrace-svc-postgresql"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_NAME: "channel_service"
